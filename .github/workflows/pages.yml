name: GitHub Pages 배포
run-name: 패치노트 0.2.2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    name: 확인하고 짓기
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Node 24 준비
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 꾸러미 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 사이트 짓기
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 결과물 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 사이트에 붙이기
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: 배포
        uses: actions/deploy-pages@v4
